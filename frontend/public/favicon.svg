<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="bg">
      <rect width="32" height="32" rx="6"/>
    </clipPath>
  </defs>
  <rect width="32" height="32" rx="6" fill="#ffffff"/>
  <g clip-path="url(#bg)">
    <!-- Blue diamond -->
    <polygon points="16,2 30,16 16,30 2,16" fill="#1a3b8c"/>
    <!-- Red border -->
    <polygon points="16,2 30,16 16,30 2,16" fill="none" stroke="#cc2200" stroke-width="1.5"/>
    <!-- Baseball -->
    <circle cx="16" cy="16" r="7" fill="#ffffff"/>
    <!-- Stitches -->
    <path d="M10 13 Q12 16 10 19" fill="none" stroke="#cc2200" stroke-width="1" stroke-linecap="round"/>
    <path d="M22 13 Q20 16 22 19" fill="none" stroke="#cc2200" stroke-width="1" stroke-linecap="round"/>
    <!-- UD text -->
    <text x="16" y="19" font-family="Georgia, serif" font-size="5.5" font-weight="bold" font-style="italic" fill="#cc2200" text-anchor="middle">UD</text>
  </g>
</svg>
